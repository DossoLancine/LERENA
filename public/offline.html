<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C2410C">
  <title>Hors ligne — Lerena</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #111827; font-family: Inter, system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 340px; text-align: center; animation: in 420ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #4b5563; line-height: 1.5; margin: 0 0 24px; }
    button { background: #c2410c; color: #fff; border: 0; border-radius: 14px; padding: 14px 24px; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:active { scale: 0.96; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Pas de connexion</h1>
    <p>Votre place dans la file est conservée. Dès que le réseau revient, la page se met à jour.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
